services:
  - type: web
    name: phishguard-ai
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python backend/predownload_nltk.py"
    startCommand: "python backend/app.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Sets the initial admin login on first deploy. If you leave this out,
      # the app generates a random password itself and prints it once to
      # the Render service logs — check Logs in the Render dashboard right
      # after your first deploy if you don't set this.
      - key: ADMIN_PASSWORD
        sync: false
      # Optional — only needed if you set up Gmail/Outlook OAuth (see
      # SETUP_GMAIL.md / SETUP_OUTLOOK.md). Leave unset and those
      # integrations just stay disabled; manual .eml upload and IMAP
      # (Yahoo etc.) still work fine without them.
      # - key: GOOGLE_REDIRECT_URI
      #   value: https://YOUR-RENDER-URL.onrender.com/auth/gmail/callback
      # - key: OUTLOOK_REDIRECT_URI
      #   value: https://YOUR-RENDER-URL.onrender.com/auth/outlook/callback
      # Optional — needed for new users to receive their OTP verification
      # email on registration. Works with a Gmail account + App Password,
      # an Outlook account, or any SMTP-based transactional email provider.
      # Leave unset and registration still works, but the code only appears
      # in the server logs instead of an actual email.
      # - key: SMTP_HOST
      #   value: smtp.gmail.com
      # - key: SMTP_PORT
      #   value: 587
      # - key: SMTP_USER
      #   value: your-address@gmail.com
      # - key: SMTP_PASSWORD
      #   sync: false
